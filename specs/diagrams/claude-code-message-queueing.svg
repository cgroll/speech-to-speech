<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Claude Code: wohin eine zweite Nachricht während der Verarbeitung geht</title>
  <desc>Timeline der fünf Normalzustände oben. Drei Verzweigungen darunter zeigen, wann eine während "Verarbeitung" bzw. "Antwort" eingereihte Nachricht zugestellt wird, und was Esc auslöst.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead" />
    </marker>
    <marker id="arrow-thin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-thin" />
    </marker>
  </defs>

  <style>
    .surface    { fill: #fcfcfb; }
    .border     { stroke: rgba(11,11,11,0.10); }
    .state-box  { fill: #f2f1ee; stroke: #52514e; stroke-width: 1.5; }
    .state-text { fill: #0b0b0b; font-weight: 600; }
    .sub-text   { fill: #52514e; font-size: 11.5px; }
    .edge       { stroke: #52514e; stroke-width: 2; fill: none; }
    .edge-thin  { stroke: #898781; stroke-width: 1.5; fill: none; }
    .edge-stop  { stroke: #898781; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    .edge-label { fill: #0b0b0b; font-size: 13px; }
    .edge-label-muted { fill: #52514e; font-size: 12px; }
    .arrowhead  { fill: #52514e; }
    .arrowhead-thin { fill: #898781; }
    .caption    { fill: #898781; font-size: 12.5px; }
    .legend-text{ fill: #52514e; font-size: 12px; }

    .chan-sameturn      { fill: #fdece3; stroke: #eb6834; stroke-width: 1.5; }
    .chan-sameturn-text { fill: #9a3f18; font-weight: 600; }
    .chan-nextturn      { fill: #e7f0fb; stroke: #2a78d6; stroke-width: 1.5; }
    .chan-nextturn-text { fill: #184f95; font-weight: 600; }
    .chan-escape        { fill: #f2f1ee; stroke: #898781; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .chan-escape-text   { fill: #52514e; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
      .surface    { fill: #1a1a19; }
      .border     { stroke: rgba(255,255,255,0.10); }
      .state-box  { fill: #2a2a28; stroke: #c3c2b7; }
      .state-text { fill: #ffffff; }
      .sub-text   { fill: #c3c2b7; }
      .edge       { stroke: #c3c2b7; }
      .edge-thin  { stroke: #6b6a63; }
      .edge-stop  { stroke: #6b6a63; }
      .edge-label { fill: #ffffff; }
      .edge-label-muted { fill: #c3c2b7; }
      .arrowhead  { fill: #c3c2b7; }
      .arrowhead-thin { fill: #6b6a63; }
      .caption    { fill: #898781; }
      .legend-text{ fill: #c3c2b7; }

      .chan-sameturn      { fill: #3a2317; stroke: #d95926; }
      .chan-sameturn-text { fill: #f0a884; }
      .chan-nextturn      { fill: #142a42; stroke: #3987e5; }
      .chan-nextturn-text { fill: #86b6ef; }
      .chan-escape        { fill: #2a2a28; stroke: #6b6a63; }
      .chan-escape-text   { fill: #c3c2b7; }
    }
  </style>

  <rect x="0" y="0" width="1180" height="620" rx="16" class="surface border" />
  <text x="24" y="28" class="caption">Claude Code -- Zustellung einer zweiten Nachricht (docs/reference-claude-code-turn-taking.md Abschnitt 2)</text>

  <!-- compact timeline -->
  <rect x="40" y="60" width="130" height="56" rx="12" class="state-box" />
  <text x="105" y="94" text-anchor="middle" class="state-text" font-size="14">Tippen</text>

  <line x1="170" y1="88" x2="194" y2="88" class="edge" marker-end="url(#arrow)" />

  <rect x="200" y="60" width="120" height="56" rx="12" class="state-box" />
  <text x="260" y="94" text-anchor="middle" class="state-text" font-size="14">Senden</text>

  <line x1="320" y1="88" x2="344" y2="88" class="edge" marker-end="url(#arrow)" />

  <rect x="350" y="60" width="220" height="56" rx="12" class="state-box" />
  <text x="460" y="88" text-anchor="middle" class="state-text" font-size="14">Verarbeitung</text>
  <text x="460" y="104" text-anchor="middle" class="sub-text" font-size="10.5">Tool-Phase</text>

  <line x1="570" y1="88" x2="594" y2="88" class="edge" marker-end="url(#arrow)" />

  <rect x="600" y="60" width="170" height="56" rx="12" class="state-box" />
  <text x="685" y="88" text-anchor="middle" class="state-text" font-size="14">Antwort</text>
  <text x="685" y="104" text-anchor="middle" class="sub-text" font-size="10.5">streamt</text>

  <line x1="770" y1="88" x2="794" y2="88" class="edge" marker-end="url(#arrow)" />

  <rect x="800" y="60" width="220" height="56" rx="12" class="state-box" />
  <text x="910" y="94" text-anchor="middle" class="state-text" font-size="14">Anzeige abgeschlossen</text>

  <!-- branch 1: queued during Verarbeitung -->
  <line x1="460" y1="116" x2="460" y2="176" class="edge-thin" marker-end="url(#arrow-thin)" />
  <text x="460" y="150" text-anchor="middle" class="edge-label-muted" font-size="11.5">Enter während Tool-Phase</text>

  <rect x="260" y="182" width="400" height="88" rx="14" class="chan-sameturn" />
  <text x="460" y="208" text-anchor="middle" class="chan-sameturn-text" font-size="14">Fall A -- noch im selben Turn</text>
  <text x="460" y="230" text-anchor="middle" class="sub-text">Zustellung sobald die laufenden Tool-Aufrufe</text>
  <text x="460" y="246" text-anchor="middle" class="sub-text">fertig sind -- rutscht in "Verarbeitung" mit rein,</text>
  <text x="460" y="262" text-anchor="middle" class="sub-text">kann das Ergebnis dieses Turns noch beeinflussen</text>

  <!-- branch 2: queued during Antwort -->
  <line x1="685" y1="116" x2="685" y2="176" class="edge-thin" marker-end="url(#arrow-thin)" />
  <text x="685" y="150" text-anchor="middle" class="edge-label-muted" font-size="11.5">Enter während Antwort (oder danach)</text>

  <rect x="680" y="182" width="420" height="88" rx="14" class="chan-nextturn" />
  <text x="890" y="208" text-anchor="middle" class="chan-nextturn-text" font-size="14">Fall B -- automatisch als nächster Turn</text>
  <text x="890" y="230" text-anchor="middle" class="sub-text">kein erneuter Tastendruck nötig -- geht los,</text>
  <text x="890" y="246" text-anchor="middle" class="sub-text">sobald der laufende Turn zu Ende ist, direkt</text>
  <text x="890" y="262" text-anchor="middle" class="sub-text">im Anschluss an "Anzeige abgeschlossen"</text>

  <!-- branch 3: Esc at any point -->
  <line x1="460" y1="270" x2="460" y2="330" class="edge-stop" />
  <line x1="890" y1="270" x2="890" y2="330" class="edge-stop" />
  <path d="M460,330 L890,330" class="edge-stop" />
  <line x1="675" y1="330" x2="675" y2="366" class="edge-stop" marker-end="url(#arrow-thin)" />

  <rect x="430" y="372" width="490" height="90" rx="14" class="chan-escape" />
  <text x="675" y="398" text-anchor="middle" class="chan-escape-text" font-size="14">Fall C -- Esc, jederzeit</text>
  <text x="675" y="420" text-anchor="middle" class="sub-text">bricht den laufenden Turn sofort ab (Tool-Phase</text>
  <text x="675" y="436" text-anchor="middle" class="sub-text">oder Antwort) -- danach geht die Warteschlange</text>
  <text x="675" y="452" text-anchor="middle" class="sub-text">direkt raus. Entspricht dem Barge-in-Fall.</text>

  <!-- send-now note -->
  <rect x="60" y="490" width="1060" height="90" rx="12" class="state-box" />
  <text x="90" y="516" class="state-text" font-size="13.5">Ctrl+Enter / Ctrl+X Ctrl+S ("send now", ab v2.1.275)</text>
  <text x="90" y="538" class="sub-text">Schickt Warteschlange + Entwurf sofort los, ohne auf Turn-Ende zu warten. Läuft gerade etwas</text>
  <text x="90" y="554" class="sub-text">Hintergrund-fähiges (Shell/Subagent): das läuft weiter, die Nachrichten kommen im selben Turn an.</text>
  <text x="90" y="570" class="sub-text">Schreibt Claude nur die Antwort: der Turn wird abgebrochen, wie bei Esc -- aber ohne Draft zu verlieren.</text>

  <!-- legend -->
  <rect x="60" y="596" width="20" height="14" rx="4" class="chan-sameturn" />
  <text x="88" y="607" class="legend-text">Fall A: selber Turn</text>
  <rect x="260" y="596" width="20" height="14" rx="4" class="chan-nextturn" />
  <text x="288" y="607" class="legend-text">Fall B: nächster Turn</text>
  <rect x="470" y="596" width="20" height="14" rx="4" class="chan-escape" />
  <text x="498" y="607" class="legend-text">Fall C: Abbruch (Esc)</text>
</svg>
