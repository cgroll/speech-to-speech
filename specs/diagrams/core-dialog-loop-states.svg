<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Zustandsmodell der Kern-Dialogschleife</title>
  <desc>Idle, Eingabe, Processing und Responding mit ihren Übergängen; Eingabe und Responding sind im Textmodus augenblicklich bzw. nur Anzeige, im Sprachmodus dauern sie (Aufnahme bzw. Wiedergabe). Processing erzeugt optional einen Denkprozess-Kanal und immer den atomaren Antwort-Kanal. Stop führt aus jedem Nicht-Idle-Zustand zurück nach Idle.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-muted" />
    </marker>
    <marker id="arrow-thin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-thin" />
    </marker>
  </defs>

  <style>
    .surface   { fill: #fcfcfb; }
    .border    { stroke: rgba(11,11,11,0.10); }
    .state-box { fill: #f2f1ee; stroke: #52514e; stroke-width: 1.5; }
    .state-box-adapter { fill: #f2f1ee; stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .state-text{ fill: #0b0b0b; font-weight: 600; }
    .sub-text  { fill: #52514e; font-size: 11.5px; }
    .edge      { stroke: #52514e; stroke-width: 2; fill: none; }
    .edge-label{ fill: #0b0b0b; font-size: 13.5px; }
    .edge-label-muted{ fill: #52514e; font-size: 12.5px; }
    .edge-stop { stroke: #898781; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    .arrowhead { fill: #52514e; }
    .arrowhead-muted { fill: #898781; }
    .arrowhead-thin { fill: #898781; }
    .chan-line { stroke: #898781; stroke-width: 1.5; fill: none; }
    .chan-answer   { fill: #e7f0fb; stroke: #2a78d6; stroke-width: 1.5; }
    .chan-answer-text { fill: #184f95; font-weight: 600; }
    .chan-thinking { fill: #fdece3; stroke: #eb6834; stroke-width: 1.5; }
    .chan-thinking-text { fill: #9a3f18; font-weight: 600; }
    .legend-text { fill: #52514e; font-size: 12px; }
    .caption   { fill: #898781; font-size: 12.5px; }

    @media (prefers-color-scheme: dark) {
      .surface   { fill: #1a1a19; }
      .border    { stroke: rgba(255,255,255,0.10); }
      .state-box { fill: #2a2a28; stroke: #c3c2b7; }
      .state-box-adapter { fill: #2a2a28; stroke: #c3c2b7; }
      .state-text{ fill: #ffffff; }
      .sub-text  { fill: #c3c2b7; }
      .edge      { stroke: #c3c2b7; }
      .edge-label{ fill: #ffffff; }
      .edge-label-muted{ fill: #c3c2b7; }
      .edge-stop { stroke: #6b6a63; }
      .arrowhead { fill: #c3c2b7; }
      .arrowhead-muted { fill: #6b6a63; }
      .arrowhead-thin { fill: #6b6a63; }
      .chan-line { stroke: #6b6a63; }
      .chan-answer   { fill: #142a42; stroke: #3987e5; }
      .chan-answer-text { fill: #86b6ef; }
      .chan-thinking { fill: #3a2317; stroke: #d95926; }
      .chan-thinking-text { fill: #f0a884; }
      .legend-text { fill: #c3c2b7; }
      .caption   { fill: #898781; }
    }
  </style>

  <rect x="0" y="0" width="1180" height="760" rx="16" class="surface border" />
  <text x="24" y="28" class="caption">Zustandsmodell: Kern-Dialogschleife (docs/specs/core-dialog-loop.md) -- gestrichelte Boxen: im Textmodus Dauer null</text>

  <!-- output channels, branching upward from Processing -->
  <line x1="650" y1="260" x2="595" y2="122" class="chan-line" marker-end="url(#arrow-thin)" />
  <line x1="650" y1="260" x2="805" y2="122" class="chan-line" marker-end="url(#arrow-thin)" />

  <rect x="500" y="58" width="190" height="64" rx="10" class="chan-thinking" />
  <text x="595" y="82" text-anchor="middle" class="chan-thinking-text" font-size="13.5">Denkprozess-Kanal</text>
  <text x="595" y="99" text-anchor="middle" class="sub-text" font-size="11">optional, nie an die</text>
  <text x="595" y="112" text-anchor="middle" class="sub-text" font-size="11">Sprachausgabe weitergereicht</text>

  <rect x="710" y="58" width="190" height="64" rx="10" class="chan-answer" />
  <text x="805" y="82" text-anchor="middle" class="chan-answer-text" font-size="13.5">Antwort-Kanal</text>
  <text x="805" y="99" text-anchor="middle" class="sub-text" font-size="11">atomar: ganz oder gar nicht,</text>
  <text x="805" y="112" text-anchor="middle" class="sub-text" font-size="11">kein Text-Streaming</text>

  <!-- state boxes -->
  <rect x="40" y="260" width="150" height="80" rx="16" class="state-box" />
  <text x="115" y="306" text-anchor="middle" class="state-text" font-size="17">Idle</text>

  <rect x="300" y="260" width="150" height="80" rx="16" class="state-box-adapter" />
  <text x="375" y="300" text-anchor="middle" class="state-text" font-size="17">Eingabe</text>
  <text x="375" y="318" text-anchor="middle" class="sub-text">Text: Dauer 0 -- Sprache: Aufnahme</text>

  <rect x="560" y="260" width="180" height="80" rx="16" class="state-box" />
  <text x="650" y="306" text-anchor="middle" class="state-text" font-size="17">Processing</text>

  <rect x="860" y="260" width="170" height="80" rx="16" class="state-box-adapter" />
  <text x="945" y="300" text-anchor="middle" class="state-text" font-size="17">Responding</text>
  <text x="945" y="318" text-anchor="middle" class="sub-text">Text: Anzeige -- Sprache: Wiedergabe</text>

  <!-- forward transitions -->
  <line x1="190" y1="300" x2="294" y2="300" class="edge" marker-end="url(#arrow)" />
  <text x="242" y="286" text-anchor="middle" class="edge-label" font-size="12.5">Eingabe beginnt</text>

  <line x1="450" y1="300" x2="554" y2="300" class="edge" marker-end="url(#arrow)" />
  <text x="502" y="286" text-anchor="middle" class="edge-label" font-size="12.5">Eingabe abgeschlossen</text>

  <line x1="740" y1="300" x2="854" y2="300" class="edge" marker-end="url(#arrow)" />
  <text x="797" y="286" text-anchor="middle" class="edge-label" font-size="12.5">Antwort beginnt</text>

  <!-- Stop from Eingabe (shallowest) -->
  <path d="M 375,340 C 375,386 160,386 160,340" class="edge-stop" marker-end="url(#arrow-muted)" />
  <rect x="200" y="368" width="200" height="20" class="surface" />
  <text x="300" y="383" text-anchor="middle" class="edge-label-muted" font-size="12.5">Stop: Eingabe verworfen</text>

  <!-- Ausgabe abgeschlossen: Responding -> Idle (solid, normal path) -->
  <path d="M 945,340 C 945,432 130,432 130,340" class="edge" marker-end="url(#arrow)" />
  <rect x="440" y="420" width="220" height="24" class="surface" />
  <text x="550" y="437" text-anchor="middle" class="edge-label" font-size="13">Ausgabe abgeschlossen</text>

  <!-- Stop from Responding -->
  <path d="M 995,340 C 995,500 100,500 100,340" class="edge-stop" marker-end="url(#arrow-muted)" />
  <rect x="430" y="488" width="320" height="24" class="surface" />
  <text x="590" y="505" text-anchor="middle" class="edge-label-muted" font-size="12.5">Stop/Barge-in: Text bleibt, nur Audio stoppt</text>

  <!-- Stop from Processing -->
  <path d="M 650,340 C 650,590 70,590 70,340" class="edge-stop" marker-end="url(#arrow-muted)" />
  <rect x="230" y="578" width="260" height="24" class="surface" />
  <text x="360" y="595" text-anchor="middle" class="edge-label-muted" font-size="12.5">Stop-Button: Aufruf abgebrochen</text>

  <!-- legend -->
  <line x1="940" y1="660" x2="980" y2="660" class="edge" />
  <text x="988" y="664" class="legend-text">regulärer Übergang</text>
  <line x1="940" y1="683" x2="980" y2="683" class="edge-stop" />
  <text x="988" y="687" class="legend-text">Stop</text>
  <rect x="60" y="650" width="760" height="60" rx="10" class="state-box-adapter" />
  <text x="80" y="672" class="sub-text" font-size="12">Gestrichelte Box = Zustand mit modusabhängiger Dauer (Eingabe, Responding):</text>
  <text x="80" y="690" class="sub-text" font-size="12">im Textmodus augenblicklich/reine Anzeige, im Sprachmodus so lange wie Aufnahme bzw. Wiedergabe dauern.</text>
</svg>
