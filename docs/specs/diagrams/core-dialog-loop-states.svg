<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Zustandsmodell der Kern-Dialogschleife</title>
  <desc>Idle, Processing und Responding mit ihren Übergängen; Processing erzeugt optional einen Denkprozess-Kanal und immer den atomaren Antwort-Kanal; Stop führt aus Processing oder Responding zurück nach Idle.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-muted" />
    </marker>
    <marker id="arrow-thin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-thin" />
    </marker>
  </defs>

  <style>
    .surface   { fill: #fcfcfb; }
    .border    { stroke: rgba(11,11,11,0.10); }
    .state-box { fill: #f2f1ee; stroke: #52514e; stroke-width: 1.5; }
    .state-text{ fill: #0b0b0b; font-weight: 600; }
    .sub-text  { fill: #52514e; font-size: 12px; }
    .edge      { stroke: #52514e; stroke-width: 2; fill: none; }
    .edge-label{ fill: #0b0b0b; font-size: 14px; }
    .edge-label-muted{ fill: #52514e; font-size: 12.5px; }
    .edge-stop { stroke: #898781; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    .arrowhead { fill: #52514e; }
    .arrowhead-muted { fill: #898781; }
    .arrowhead-thin { fill: #898781; }
    .chan-line { stroke: #898781; stroke-width: 1.5; fill: none; }
    .chan-answer   { fill: #e7f0fb; stroke: #2a78d6; stroke-width: 1.5; }
    .chan-answer-text { fill: #184f95; font-weight: 600; }
    .chan-thinking { fill: #fdece3; stroke: #eb6834; stroke-width: 1.5; }
    .chan-thinking-text { fill: #9a3f18; font-weight: 600; }
    .legend-text { fill: #52514e; font-size: 12px; }
    .caption   { fill: #898781; font-size: 12.5px; }

    @media (prefers-color-scheme: dark) {
      .surface   { fill: #1a1a19; }
      .border    { stroke: rgba(255,255,255,0.10); }
      .state-box { fill: #2a2a28; stroke: #c3c2b7; }
      .state-text{ fill: #ffffff; }
      .sub-text  { fill: #c3c2b7; }
      .edge      { stroke: #c3c2b7; }
      .edge-label{ fill: #ffffff; }
      .edge-label-muted{ fill: #c3c2b7; }
      .edge-stop { stroke: #6b6a63; }
      .arrowhead { fill: #c3c2b7; }
      .arrowhead-muted { fill: #6b6a63; }
      .arrowhead-thin { fill: #6b6a63; }
      .chan-line { stroke: #6b6a63; }
      .chan-answer   { fill: #142a42; stroke: #3987e5; }
      .chan-answer-text { fill: #86b6ef; }
      .chan-thinking { fill: #3a2317; stroke: #d95926; }
      .chan-thinking-text { fill: #f0a884; }
      .legend-text { fill: #c3c2b7; }
      .caption   { fill: #898781; }
    }
  </style>

  <rect x="0" y="0" width="960" height="700" rx="16" class="surface border" />

  <!-- output channels, branching upward from Processing -->
  <line x1="480" y1="260" x2="425" y2="122" class="chan-line" marker-end="url(#arrow-thin)" />
  <line x1="480" y1="260" x2="635" y2="122" class="chan-line" marker-end="url(#arrow-thin)" />

  <rect x="330" y="58" width="190" height="64" rx="10" class="chan-thinking" />
  <text x="425" y="82" text-anchor="middle" class="chan-thinking-text" font-size="13.5">Denkprozess-Kanal</text>
  <text x="425" y="99" text-anchor="middle" class="sub-text" font-size="11">optional, nie an die</text>
  <text x="425" y="112" text-anchor="middle" class="sub-text" font-size="11">Sprachausgabe weitergereicht</text>

  <rect x="540" y="58" width="190" height="64" rx="10" class="chan-answer" />
  <text x="635" y="82" text-anchor="middle" class="chan-answer-text" font-size="13.5">Antwort-Kanal</text>
  <text x="635" y="99" text-anchor="middle" class="sub-text" font-size="11">atomar: ganz oder gar nicht,</text>
  <text x="635" y="112" text-anchor="middle" class="sub-text" font-size="11">kein Text-Streaming</text>

  <!-- state boxes -->
  <rect x="50" y="260" width="170" height="80" rx="16" class="state-box" />
  <text x="135" y="306" text-anchor="middle" class="state-text" font-size="18">Idle</text>

  <rect x="395" y="260" width="170" height="80" rx="16" class="state-box" />
  <text x="480" y="306" text-anchor="middle" class="state-text" font-size="18">Processing</text>

  <rect x="740" y="260" width="170" height="80" rx="16" class="state-box" />
  <text x="825" y="306" text-anchor="middle" class="state-text" font-size="18">Responding</text>

  <!-- forward transitions -->
  <line x1="220" y1="300" x2="389" y2="300" class="edge" marker-end="url(#arrow)" />
  <text x="305" y="286" text-anchor="middle" class="edge-label">Eingabe abgeschlossen</text>

  <line x1="565" y1="300" x2="734" y2="300" class="edge" marker-end="url(#arrow)" />
  <text x="650" y="286" text-anchor="middle" class="edge-label">Antwort beginnt</text>

  <!-- return arc: Responding -> Idle (Ausgabe abgeschlossen) -->
  <path d="M 790,340 C 790,396 170,396 170,340" class="edge" marker-end="url(#arrow)" />
  <rect x="368" y="399" width="224" height="21" class="surface" />
  <text x="480" y="414" text-anchor="middle" class="edge-label">Ausgabe abgeschlossen</text>

  <!-- Stop from Responding -->
  <path d="M 862,340 C 862,492 135,492 135,340" class="edge-stop" marker-end="url(#arrow-muted)" />
  <rect x="560" y="458" width="300" height="38" class="surface" />
  <text x="710" y="470" text-anchor="middle" class="edge-label-muted">Stop -- Antwort-Kanal schon voll:</text>
  <text x="710" y="487" text-anchor="middle" class="edge-label-muted">nur Sprachausgabe wird unterdrückt, Text bleibt</text>

  <!-- Stop from Processing -->
  <path d="M 480,340 C 480,598 100,598 100,340" class="edge-stop" marker-end="url(#arrow-muted)" />
  <rect x="122" y="564" width="336" height="38" class="surface" />
  <text x="290" y="576" text-anchor="middle" class="edge-label-muted">Stop -- Antwort-Kanal noch leer:</text>
  <text x="290" y="593" text-anchor="middle" class="edge-label-muted">Aufruf abgebrochen, Abbruch im Verlauf markiert</text>

  <!-- legend -->
  <line x1="770" y1="645" x2="810" y2="645" class="edge" />
  <text x="818" y="649" class="legend-text">regulärer Übergang</text>
  <line x1="770" y1="668" x2="810" y2="668" class="edge-stop" />
  <text x="818" y="672" class="legend-text">Stop</text>

  <text x="24" y="28" class="caption">Zustandsmodell: Kern-Dialogschleife (docs/specs/core-dialog-loop.md)</text>
</svg>
