site_name: Speech-to-Speech
site_description: Dokumentation des Sprachassistenten-Projekts
repo_url: https://github.com/cgroll/speech-to-speech
repo_name: cgroll/speech-to-speech

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Start: index.md
  - Feature-Übersicht: specification.md
  - Spezifikationen:
      - Kern-Dialogschleife: specs/core-dialog-loop.md
      - "Denkprozess-Kanal & Stop-Markierung": specs/thinking-channel-and-stop-marker.md
  - "Referenz: Turn-Taking in Claude Code": reference-claude-code-turn-taking.md
  - Architektur-Vorschlag: architecture-proposal.md
  - Telegram-Bot-Vorschlag: telegram-bot-proposal.md
  - Backlog: backlog.md
  - macOS-Setup: macos-setup.md
